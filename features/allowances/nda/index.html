
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071326">
  <title>Night Duty Allowance | Railway Mitra</title>
  <link rel="stylesheet" href="../../../assets/css/main.css">

  <style>
    .rm-nda-card {
      background: #0f172a;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.3);
      border: 1px solid #1e293b;
      max-width: 480px;
      margin: 15px auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }
    .rm-nda-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .rm-nda-header h3 {
      margin: 0;
      font-size: 18px;
      color: #38bdf8;
    }
    .rm-nda-group { margin-bottom: 14px; }
    .rm-nda-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    .rm-nda-group input,
    .rm-nda-group select {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #334155;
      border-radius: 8px;
      font-size: 15px;
      background: #1e293b;
      color: #fff;
      box-sizing: border-box;
    }
    .rm-nda-group input:focus,
    .rm-nda-group select:focus {
      outline: none;
      border-color: #0284c7;
    }
    .rm-nda-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg,#0284c7,#0369a1);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .rm-nda-btn:active { transform: scale(.98); }
    .rm-nda-result {
      display: none;
      margin-top: 18px;
      background: #131c31;
      border: 1.5px solid #0284c7;
      border-radius: 10px;
      padding: 16px;
    }
    .rm-nda-main-amt {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px dashed #334155;
      margin-bottom: 12px;
    }
    .rm-nda-main-amt span {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }
    .rm-nda-main-amt h2 {
      margin: 4px 0 0;
      font-size: 28px;
      color: #38bdf8;
    }
    .rm-nda-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .rm-nda-box {
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .rm-nda-box small {
      display: block;
      font-size: 11px;
      color: #94a3b8;
    }
    .rm-nda-box strong {
      font-size: 14px;
      color: #fff;
    }
    .rm-nda-note {
      margin-top: 12px;
      font-size: 12px;
      color: #7dd3fc;
      background: #0c4a6e;
      padding: 8px 10px;
      border-radius: 6px;
      line-height: 1.4;
    }
    .nda-page {
      max-width: 600px;
      margin: 24px auto;
      padding: 16px;
    }
    .nda-back {
      display: inline-block;
      color: #65eaff;
      text-decoration: none;
      margin-bottom: 18px;
    }
  </style>
</head>

<body>
<main class="nda-page">

  <a href="../index.html" class="nda-back">← भत्ता कैलकुलेटर पर वापस जाएँ</a>

  <div class="rm-nda-card">
    <div class="rm-nda-header">
      <span style="font-size:22px;">🌙</span>
      <div>
        <h3>Night Duty Allowance (NDA)</h3>
        <small style="color:#94a3b8;">22:00 to 06:00 Hrs (10 Min/Hr Weightage)</small>
      </div>
    </div>

    <div class="rm-nda-group">
      <label for="rmNdaBasic">1. Basic Pay (मूल वेतन ₹)</label>
      <input type="number" id="rmNdaBasic" placeholder="e.g. 25500" value="25500" min="18000">
    </div>

    <div class="rm-nda-group">
      <label for="rmNdaDa">2. Current DA (%)</label>
      <input type="number" id="rmNdaDa" value="63" min="0">
    </div>

    <div class="rm-nda-group">
      <label for="rmNdaHours">3. Total Night Duty Hours (22:00 - 06:00 के कुल घंटे)</label>
      <input type="number" id="rmNdaHours" placeholder="उदाहरण: 8 घंटे की 5 नाइट = 40" value="40" min="0" step="0.5">
    </div>

    <div class="rm-nda-group">
      <label for="rmNdaStaff">4. Staff Category (कर्मचारी वर्ग)</label>
      <select id="rmNdaStaff">
        <option value="general" selected>General Staff (Non-Running)</option>
        <option value="running">Running Staff (Loco Pilot / Guard)</option>
      </select>
    </div>

    <button type="button" class="rm-nda-btn" onclick="calculateRmNDA()">Calculate NDA / गणना करें</button>

    <div class="rm-nda-result" id="rmNdaResult" aria-live="polite">
      <div class="rm-nda-main-amt">
        <span>TOTAL NIGHT DUTY ALLOWANCE</span>
        <h2 id="rmTotalNda">₹0</h2>
      </div>

      <div class="rm-nda-grid">
        <div class="rm-nda-box">
          <small>Hourly Rate ((BP+DA)/200)</small>
          <strong id="rmNdaRate">₹0/hr</strong>
        </div>
        <div class="rm-nda-box">
          <small>Weightage Hours (Hrs ÷ 6)</small>
          <strong id="rmNdaWeightage">0 Hrs</strong>
        </div>
        <div class="rm-nda-box">
          <small>Effective Basic Used</small>
          <strong id="rmNdaEffBasic">₹0</strong>
        </div>
        <div class="rm-nda-box">
          <small>DA Amount Included</small>
          <strong id="rmNdaDaAmt">₹0</strong>
        </div>
      </div>

      <div class="rm-nda-note" id="rmNdaNote"></div>
    </div>
  </div>
</main>

<script>
function calculateRmNDA() {
  const basic = parseFloat(document.getElementById('rmNdaBasic').value);
  const daInput = document.getElementById('rmNdaDa').value;
  const da = parseFloat(daInput);
  const hoursInput = document.getElementById('rmNdaHours').value;
  const nightHours = parseFloat(hoursInput);
  const staff = document.getElementById('rmNdaStaff').value;

  if (!Number.isFinite(basic) || basic <= 0) {
    alert("कृपया सही Basic Pay दर्ज करें।");
    return;
  }

  if (daInput.trim() === '' || !Number.isFinite(da) || da < 0 || da > 1000) {
    alert("कृपया सही DA प्रतिशत दर्ज करें।");
    return;
  }

  if (hoursInput.trim() === '' || !Number.isFinite(nightHours) || nightHours < 0) {
    alert("कृपया सही Night Duty Hours दर्ज करें।");
    return;
  }

  // मूल दिए गए कोड का Running Staff नियम
  let calcBasic = (staff === 'running') ? (basic * 1.30) : basic;

  // RBE 85/2022 के अनुसार अधिकतम Basic Pay सीमा
  const ceilingLimit = 43600;
  let isCapped = false;

  if (calcBasic > ceilingLimit) {
    calcBasic = ceilingLimit;
    isCapped = true;
  }

  const daAmount = calcBasic * (da / 100);
  const hourlyRate = (calcBasic + daAmount) / 200;
  const weightageHours = nightHours / 6;
  const totalNDA = Math.round(hourlyRate * weightageHours);

  const money = value => "₹" + Math.round(value).toLocaleString('en-IN');

  document.getElementById('rmTotalNda').innerText = money(totalNDA);
  document.getElementById('rmNdaRate').innerText = "₹" + hourlyRate.toFixed(2) + "/hr";
  document.getElementById('rmNdaWeightage').innerText = weightageHours.toFixed(2) + " Hrs";
  document.getElementById('rmNdaEffBasic').innerText = money(calcBasic);
  document.getElementById('rmNdaDaAmt').innerText = money(daAmount);

  let note = `ℹ️ गणना: ₹${hourlyRate.toFixed(2)} (प्रति घंटा दर) × ${weightageHours.toFixed(2)} वेटेज घंटे (${nightHours} नाइट घंटे ÷ 6) = ${money(totalNDA)}।`;

  if (isCapped) {
    note = `ℹ️ अधिकतम Basic Pay सीमा ₹43,600 लागू की गई है। ` + note;
  }

  document.getElementById('rmNdaNote').innerText = note;
  document.getElementById('rmNdaResult').style.display = 'block';
}
</script>

<script type="module" src="../../../assets/js/auth-guard.js"></script>
</body>
</html>
